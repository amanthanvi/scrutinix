version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Listed before minor-and-patch so it also claims major bumps.
      # @vitest/* declares an exact peer on vitest, so splitting the two into
      # separate PRs makes each one individually unsatisfiable (ERESOLVE).
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
