name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # The audit gate depends on facts that change without anyone touching the
  # repo: a new advisory is published, a fix ships, or an accepted exception
  # reaches its review date. Without a schedule none of that surfaces until
  # the next PR happens to run. Off the hour, because GitHub's scheduler
  # queues everything pinned to :00 behind everyone else's.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Audit runs as its own job rather than as a step in Verify. A failing audit
  # used to short-circuit the job and skip lint, typecheck, tests, build, and
  # E2E, so a single advisory hid every other signal. Keeping it parallel means
  # the two results are always independent.
  audit:
    name: Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Scoped to this job so Verify keeps read-only credentials. Only the
    # scheduled path actually files an issue.
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm run audit:ci
        env:
          AUDIT_GATE_REPORT: audit-gate-report.md

      # On a PR the red check is the notification. On a schedule nobody is
      # watching, so anything needing attention becomes a tracked issue.
      - name: File review issue
        if: always() && github.event_name == 'schedule' && hashFiles('audit-gate-report.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: "Audit gate: reviewed advisory needs attention"
        run: |
          existing=$(gh issue list --state open --search "in:title $ISSUE_TITLE" \
            --json number,title --jq \
            ".[] | select(.title == \"$ISSUE_TITLE\") | .number" | head -1)

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file audit-gate-report.md
          else
            gh issue create --title "$ISSUE_TITLE" --body-file audit-gate-report.md
          fi

  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # The scheduled run exists for the audit gate. Rebuilding and re-running
    # the whole suite against an unchanged commit would prove nothing.
    if: github.event_name != 'schedule'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit -- --run

      - name: Integration tests
        run: npm run test:integration -- --run

      - name: DOM tests
        run: npm run test:dom -- --run

      - name: Build
        run: npm run build

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Export Chromium path
        run: |
          node -e "process.stdout.write('CHROME_PATH=' + require('playwright').chromium.executablePath() + '\n')" >> "$GITHUB_ENV"

      - name: E2E tests (offline fixtures)
        run: npm run test:e2e
        env:
          SKIP_BUILD: "1"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Lighthouse
        run: npm run lighthouse
