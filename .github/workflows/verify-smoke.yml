name: Verify smoke (optional)

# Optional loop for the verify skill. It is not a required status check.
# Leave the existing CI workflow as the required gate.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Doctor, smoke, and drive
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm

      # Install output stays on the runner, in a file nothing uploads. The
      # log shows a fixed status line per step.
      - name: Install dependencies
        run: |
          status=0
          npm ci > "$RUNNER_TEMP/npm-ci.log" 2>&1 || status=$?
          echo "npm ci exited $status (output kept on the runner, not printed or uploaded)"
          exit "$status"

      - name: Install Playwright Chromium
        run: |
          status=0
          npx playwright install --with-deps chromium > "$RUNNER_TEMP/playwright-install.log" 2>&1 || status=$?
          echo "Playwright Chromium install exited $status (output kept on the runner, not printed or uploaded)"
          exit "$status"

      # Each verify command prints only fixed messages, counts, failing test
      # titles, and paths. Raw logs, the HTML report, and traces stay in the
      # private state directory on the runner; nothing is uploaded.
      - name: Launch
        run: npm --silent run verify:launch
        env:
          VERIFY_SKIP_BROWSER_INSTALL: "1"

      - name: Doctor
        run: npm --silent run verify:doctor

      - name: Skill checks
        run: npm --silent run verify:check

      - name: Smoke
        run: npm --silent run verify:smoke

      - name: Drive
        run: npm --silent run verify:drive

      - name: Cleanup
        if: always()
        run: npm --silent run verify:cleanup
