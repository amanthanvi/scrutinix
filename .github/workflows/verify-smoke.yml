name: Verify smoke (optional)

# Optional loop for the verify skill. It is not a required status check.
# Leave the existing CI workflow as the required gate.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Doctor and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Launch
        run: npm run verify:launch
        env:
          VERIFY_SKIP_BROWSER_INSTALL: "1"

      - name: Doctor
        run: npm run verify:doctor

      - name: Smoke
        run: npm run verify:smoke

      - name: Cleanup
        if: always()
        run: npm run verify:cleanup

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verify-smoke-evidence
          path: /tmp/scrutinix-verify/evidence/
          retention-days: 7
          if-no-files-found: warn
